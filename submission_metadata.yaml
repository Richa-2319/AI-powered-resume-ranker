# AI tools declaration
# ============================================================================
ai_tools_used:
  - "Claude" , "all-miniLM-L6-V2"

ai_usage_summary: |
  Used Claude (Anthropic) for architectural discussion, EDA-driven feature
  engineering decisions, debugging the compute-constraint split between
  precompute and ranking, and code generation/review for the scoring logic
  in the notebooks. No candidate data was sent to any external LLM API as
  part of the ranking pipeline itself — all scoring at inference/ranking
  time runs locally with no network calls (sentence-transformers model run
  locally, no hosted embedding or LLM API used).

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Two-stage pipeline split to satisfy the 5-minute CPU-only ranking budget.

  Stage 1 (PRECOMPUTE, offline, no time limit): parses all 100K candidate
  profiles; computes six structured sub-scores per candidate (title
  relevance, career-history quality/stability, core AI-skill depth weighted
  by proficiency+duration+endorsements, experience-years fit, location fit,
  education tier); computes a honeypot-penalty multiplier (flags
  YOE/career-history mismatches, implausible expert-skill counts,
  contradictory behavioural signals) and an availability multiplier
  (recency, open-to-work, response rate, interview completion, notice
  period, GitHub activity — all EDA-tuned to the dataset's actual value
  ranges, e.g. treating sentinel -1 values as "no data" rather than zero).
  Candidate profile text is embedded with a local sentence-transformers
  model (all-MiniLM-L6-v2) against an embedding of the JD. All of this is
  saved to a small set of artifact files (parquet + npy).

  Stage 2 (RANK, <=5 min, CPU-only, no network): loads only the precomputed
  artifacts (never re-reads the raw candidate file), computes cosine
  similarity via a single vectorised numpy matrix multiply, combines it
  with the structured score (75% structured / 25% semantic), applies the
  honeypot and availability multipliers, sorts, and writes the top-100
  ranked CSV with grounded, template-generated reasoning strings built only
  from precomputed fields (no LLM calls at ranking time).

  Feature weights and thresholds were derived empirically from a 1,000-row
  EDA pass (proficiency distribution, signal sentinel values, notice-period
  clustering, title/company distribution) rather than assumed from the JD
  alone.

